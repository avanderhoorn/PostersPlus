services:
  postersplus:
    build:
      context: .
      dockerfile: ./dockerfile
      args:
        # Bake the PP-OCRv5 Mobile detector into the image (default). Set
        # BAKE_PPOCR_MODEL=false in your .env for a lean image that downloads the
        # model once at runtime instead.
        BAKE_PPOCR_MODEL: "${BAKE_PPOCR_MODEL:-true}"
        RENDERER_REVISION: "${POSTERSPLUS_RENDERER_REVISION:-unknown}"
    image: postersplus
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./postersplus-cache:/app/cache  # cache DB, TMDB posters/logos, discovery_overrides.json
    env_file:
      - .env # see this file for an explanation of what each flag does
    environment: 
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY:-}
      - TVDB_API_KEY=${TVDB_API_KEY:-}
      - TVDB_SUBSCRIBER_PIN=${TVDB_SUBSCRIBER_PIN:-}
      - TVDB_USE_LOGOS=${TVDB_USE_LOGOS:-true}
      - TVDB_USE_BACKDROPS=${TVDB_USE_BACKDROPS:-true}
      - TVDB_USE_POSTERS=${TVDB_USE_POSTERS:-false}
      - TVDB_LOGO_PRIORITY=${TVDB_LOGO_PRIORITY:-3}
      - ACCESS_KEY=${ACCESS_KEY:-}
      - JELLYFIN_ARTWORK_DISCOVERY_KEY=${JELLYFIN_ARTWORK_DISCOVERY_KEY:-}
      - JELLYFIN_ARTWORK_FANART_PROJECT_API_KEY=${JELLYFIN_ARTWORK_FANART_PROJECT_API_KEY:-}
      - JELLYFIN_ARTWORK_FANART_CLIENT_KEY=${JELLYFIN_ARTWORK_FANART_CLIENT_KEY:-}
      - RENDER_PROFILE_PATH=${RENDER_PROFILE_PATH:-}
      - WORKERS=${WORKERS:-1}
      - TEXTLESS_DETECTION_CONCURRENCY=${TEXTLESS_DETECTION_CONCURRENCY:-2}
      - TEXTLESS_DETECTION_MAX_VOTES=${TEXTLESS_DETECTION_MAX_VOTES:-3000}
      - AIOSTREAMS_URL=${AIOSTREAMS_URL:-}
      - AIOSTREAMS_AUTH=${AIOSTREAMS_AUTH:-}
      - QUALITY_OLD_CACHE_DURATION=${QUALITY_OLD_CACHE_DURATION:-90}
      - QUALITY_BG_CONCURRENCY=${QUALITY_BG_CONCURRENCY:-5}
      - CDN_CACHE_TTL=${CDN_CACHE_TTL:-0}
      - COMPOSITE_CACHE_TTL=${COMPOSITE_CACHE_TTL:-604800}
      - COMPOSITE_MAX_ENTRIES=${COMPOSITE_MAX_ENTRIES:-0}
      - DEFAULT_LOGO_LANGUAGE=${DEFAULT_LOGO_LANGUAGE:-en}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
